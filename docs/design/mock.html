<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Huddle Screen Mock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Tokens: identical to DIRECTION.md section 1 */
:root{
  --bg:#FFF8F1;--surface:#FFFFFF;--sunken:#F6EEE6;--line:#E8DED4;
  --ink:#1F1A17;--ink-2:#5C534C;--ink-3:#857A71;
  --accent:#C2412A;--accent-soft:#FDE7E1;
  --safe:#0F766E;--safe-soft:#DDF3EF;--bold:#6D28D9;--bold-soft:#EEE5FD;--budget:#15803D;--budget-soft:#DFF5E6;
  --adv-a:#2563EB;--adv-b:#BE185D;--adv-c:#A16207;--adv-d:#0E7490;
  --ok:#15803D;--ok-soft:#DFF5E6;--warn:#B45309;--warn-soft:#FEF3C7;--bad:#B91C1C;
  --display:"Bricolage Grotesque","Inter",system-ui,sans-serif;
  --sans:"Inter","PingFang SC","Noto Sans SC",system-ui,sans-serif;
  --shadow:0 1px 2px rgb(31 26 23/.06),0 4px 16px rgb(31 26 23/.06);
}
*{box-sizing:border-box;margin:0}
body{font-family:var(--sans);background:#EDE6DE;color:var(--ink);font-size:16px;line-height:24px;padding:32px 16px}
.intro{max-width:1240px;margin:0 auto 32px}
.intro h1{font-family:var(--display);font-weight:800;font-size:28px;line-height:32px}
.intro p{color:var(--ink-2);font-size:14px;line-height:20px;margin-top:8px;max-width:720px}
.wall{display:flex;flex-wrap:wrap;gap:32px;justify-content:center}
figure{display:flex;flex-direction:column;gap:8px}
figcaption{font-size:13px;font-weight:600;color:var(--ink-2);text-align:center}
.phone{width:390px;max-width:calc(100vw - 32px);min-height:780px;background:var(--bg);border-radius:32px;box-shadow:0 12px 40px rgb(31 26 23/.18);overflow:hidden;display:flex;flex-direction:column;position:relative;border:1px solid var(--line)}
.demo{height:32px;display:flex;align-items:center;justify-content:center;gap:6px;background:var(--sunken);color:var(--ink-2);font-size:13px;font-weight:500;border-bottom:1px solid var(--line)}
.body{padding:16px;display:flex;flex-direction:column;gap:16px;flex:1}
.bar{position:sticky;bottom:0;padding:16px;background:var(--bg);border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
h1.t{font-family:var(--display);font-weight:800;font-size:28px;line-height:32px}
h2{font-family:var(--display);font-weight:600;font-size:20px;line-height:24px}
.muted{color:var(--ink-2);font-size:14px;line-height:20px}
.small{font-size:14px;line-height:20px}
.num{font-variant-numeric:tabular-nums}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow)}
.btn{min-height:48px;padding:12px 20px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font:600 16px/24px var(--sans);color:var(--ink);width:100%;cursor:pointer}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-text{background:none;border:0;color:var(--accent);font:600 14px/20px var(--sans);min-height:44px;cursor:pointer}
.chip{display:inline-flex;align-items:center;gap:4px;min-height:28px;padding:4px 10px;border-radius:999px;background:var(--sunken);font-size:13px;line-height:16px;font-weight:500;color:var(--ink-2)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.kind{display:inline-flex;align-items:center;min-height:24px;padding:2px 10px;border-radius:999px;font-size:13px;font-weight:600;color:#fff}
.k-safe{background:var(--safe)}.k-bold{background:var(--bold)}.k-budget{background:var(--budget)}
.row{display:flex;align-items:center;gap:8px}
.between{justify-content:space-between}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:16px;color:var(--ink)}
.av.sm{width:24px;height:24px;font-size:11px;margin-left:-6px;border:2px solid var(--surface)}
.t1{background:#FDE7E1}.t2{background:#DDF3EF}.t3{background:#EEE5FD}.t4{background:#FEF3C7}.t5{background:#E0ECFF}
.input{width:100%;min-height:96px;padding:12px 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font:16px/24px var(--sans);color:var(--ink);resize:none}
/* lobby */
.code{font-family:var(--display);font-weight:800;font-size:48px;line-height:56px;letter-spacing:.1em;text-align:center}
.qr{width:200px;height:200px;margin:0 auto;display:grid;grid-template-columns:repeat(21,1fr);gap:0;background:#fff;padding:8px;border-radius:8px}
.qr i{display:block;background:#1F1A17}.qr b{display:block}
.members{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.members span{font-size:13px;color:var(--ink-2)}
.ghost{border:2px dashed var(--line);background:none}
/* ring */
.ring{--v:62;width:72px;height:72px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--v)*1%),var(--sunken) 0);display:grid;place-items:center;flex:none}
.ring>div{width:56px;height:56px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font:800 18px/1 var(--display)}
/* swipe */
.pick{display:flex;gap:12px;padding:12px;border-radius:16px;background:var(--surface);border:2px solid var(--line);box-shadow:var(--shadow);min-height:152px;cursor:pointer}
.pick.sel{border-color:var(--accent)}
.ph{width:104px;border-radius:12px;flex:none}
.or{width:36px;height:36px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:600;margin:-10px auto;position:relative;z-index:1}
/* plans */
.map{height:220px;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:#EFE9E1}
.tl{list-style:none;padding:0;display:flex;flex-direction:column}
.tl li{display:grid;grid-template-columns:48px 16px 1fr;gap:8px;font-size:14px;line-height:20px}
.tl .dot{width:12px;height:12px;border-radius:50%;background:var(--safe);margin-top:4px;position:relative}
.tl .walk{color:var(--ink-3);font-size:13px}
.tl .line{width:2px;background:var(--line);margin:0 5px;min-height:20px}
.big{font:800 28px/32px var(--display)}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-size:13px;font-weight:600}
.mini{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-radius:16px;background:var(--surface);border:1px solid var(--line);min-height:56px}
/* council */
.grid{display:grid;grid-template-columns:96px repeat(3,1fr);gap:8px 4px;font-size:13px;align-items:center;text-align:center}
.grid .h{font-weight:600;color:var(--ink-2)}
.st{width:14px;height:14px;border-radius:50%;margin:0 auto;border:2px solid currentColor}
.st.for{background:currentColor}.st.ok{background:linear-gradient(90deg,currentColor 50%,transparent 50%)}
.div{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em}
.div::before,.div::after{content:"";flex:1;height:1px;background:var(--line)}
.msg{display:flex;gap:8px;align-items:flex-start}
.adv{width:32px;height:32px;border-radius:50%;color:#fff;display:grid;place-items:center;font-weight:600;font-size:14px;flex:none}
.bub{background:var(--surface);border:1px solid var(--line);border-left:3px solid;border-radius:4px 16px 16px 16px;padding:8px 12px;font-size:14px;line-height:20px}
.bub b{font-variant-numeric:tabular-nums}
.who{font-size:12px;font-weight:600;color:var(--ink-2);margin-bottom:2px}
.chair{background:var(--accent-soft);border-radius:16px;padding:12px 16px;font-size:14px;line-height:20px}
.typing{font-size:13px;color:var(--ink-3)}
/* vote */
.vote{display:flex;align-items:center;gap:12px;min-height:64px;padding:8px 16px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.vote.on{background:var(--safe-soft);border-color:var(--safe)}
.wheel{width:220px;height:220px;border-radius:50%;margin:0 auto;position:relative;background:conic-gradient(var(--safe) 0 42%,var(--bold) 0 72%,var(--budget) 0 100%);box-shadow:var(--shadow);transform:rotate(-20deg)}
.wheel::after{content:"";position:absolute;inset:80px;border-radius:50%;background:var(--bg)}
.wheel span{position:absolute;color:#fff;font-weight:600;font-size:13px;line-height:16px;text-align:center}
.pointer{width:0;height:0;border-left:10px solid transparent;border-right:10px solid transparent;border-top:18px solid var(--ink);margin:0 auto -12px;position:relative;z-index:1}
/* call */
.step{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;text-align:center;font-size:12px;line-height:16px;color:var(--ink-3)}
.step div{display:flex;flex-direction:column;align-items:center;gap:4px}
.step i{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:12px;border:2px solid var(--line);background:var(--surface)}
.step .done{color:var(--ink)}.step .done i{background:var(--ok);border-color:var(--ok);color:#fff}
.step .now{color:var(--accent);font-weight:600}.step .now i{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.step .fail{color:var(--warn);font-weight:600}.step .fail i{background:var(--warn);border-color:var(--warn);color:#fff}
.tx{display:flex;flex-direction:column;gap:8px}
.l{max-width:84%;padding:8px 12px;border-radius:16px;font-size:16px;line-height:24px}
.l small{display:block;font-size:14px;line-height:20px;color:var(--ink-2)}
.l.ag{align-self:flex-end;background:var(--accent-soft);border-bottom-right-radius:4px}
.l.rs{align-self:flex-start;background:var(--sunken);border-bottom-left-radius:4px}
.lab{font-size:12px;font-weight:600;color:var(--ink-3)}
.lab.r{align-self:flex-end}
.sys{text-align:center;font-size:13px;color:var(--ink-3)}
.confirm{text-align:center;border:2px solid var(--ok)}
.check{width:56px;height:56px;border-radius:50%;background:var(--ok);color:#fff;font-size:28px;display:grid;place-items:center;margin:0 auto 8px}
.replan{background:var(--warn-soft);border-left:4px solid var(--warn);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:8px}
.hang{min-height:44px;padding:8px 16px;border-radius:999px;border:1.5px solid var(--bad);color:var(--bad);background:none;font:600 14px/20px var(--sans)}
</style>
</head>
<body>
<div class="intro">
  <h1>Huddle: key screens at 390px</h1>
  <p>Static design mock for the Sat polish pass. Tokens match docs/design/DIRECTION.md. Place names are fictional placeholders, and the numbers are illustrative, not solver output. The real screens read live data.</p>
</div>

<div class="wall">

<!-- 1 LOBBY -->
<figure><figcaption>1 · Lobby (host)</figcaption>
<div class="phone">
  <div class="demo">⚑ Demo mode: cached data</div>
  <div class="body">
    <div class="row between"><h1 class="t">Your huddle</h1><span class="chip">Seeded demo group</span></div>
    <div class="card" style="display:flex;flex-direction:column;gap:8px;align-items:center">
      <span class="muted">Scan to join</span>
      <div class="qr" id="qr"></div>
      <div class="code">K7QX</div>
      <span class="muted">Only first names. No account.</span>
    </div>
    <div class="row between"><h2>Who's here</h2><span class="muted num">3 of 4 here</span></div>
    <div class="members">
      <div><div class="av t1" style="margin:0 auto">A</div><span>Alex</span></div>
      <div><div class="av t2" style="margin:0 auto">S</div><span>Sam</span></div>
      <div><div class="av t3" style="margin:0 auto">J</div><span>Jordan</span></div>
      <div><div class="av ghost" style="margin:0 auto"></div><span>…</span></div>
    </div>
  </div>
  <div class="bar"><button class="btn btn-primary">Everyone's in →</button></div>
</div></figure>

<!-- 2 PREFS -->
<figure><figcaption>2 · Private preferences</figcaption>
<div class="phone">
  <div class="demo">⚑ Demo mode: cached data</div>
  <div class="body">
    <h1 class="t">What do you want tonight?</h1>
    <span class="chip" style="align-self:flex-start">🔒 Only you see this</span>
    <textarea class="input">vegetarian, under $30, somewhere quiet</textarea>
    <div class="chips"><span class="chip">+ vegetarian</span><span class="chip">+ under $30</span><span class="chip">+ somewhere quiet</span></div>
    <div class="card" style="display:flex;flex-direction:column;gap:8px">
      <div class="row between"><strong class="small">Here's what we heard</strong><button class="btn-text">Edit</button></div>
      <div class="chips"><span class="chip ok">Vegetarian</span><span class="chip ok">≤ $30 / person</span><span class="chip ok">Quiet</span></div>
    </div>
  </div>
  <div class="bar"><button class="btn btn-primary">Next: quick picks →</button></div>
</div></figure>

<!-- 3 SWIPE -->
<figure><figcaption>3 · This or that</figcaption>
<div class="phone">
  <div class="demo">⚑ Demo mode: cached data</div>
  <div class="body">
    <div class="row" style="gap:16px">
      <div class="ring" style="--v:62"><div class="num">62%</div></div>
      <div><h2>Getting there</h2><p class="muted">A few more picks and the plans lock in.</p></div>
    </div>
    <div>
      <div class="pick sel">
        <div class="ph" style="background:linear-gradient(135deg,#F7C9A9,#E0533A)"></div>
        <div style="display:flex;flex-direction:column;gap:8px">
          <h2>Lotus Garden</h2><span class="muted">Dinner · Chinese</span>
          <div class="chips"><span class="chip">$$</span><span class="chip">quiet</span><span class="chip">🚶 8 min</span></div>
        </div>
      </div>
      <div class="or">or</div>
      <div class="pick">
        <div class="ph" style="background:linear-gradient(135deg,#C9E7DF,#0F766E)"></div>
        <div style="display:flex;flex-direction:column;gap:8px">
          <h2>Ember Taqueria</h2><span class="muted">Dinner · Mexican</span>
          <div class="chips"><span class="chip">$</span><span class="chip">lively</span><span class="chip">🌿 patio</span></div>
        </div>
      </div>
    </div>
    <button class="btn-text" style="align-self:center">Either is fine</button>
  </div>
  <div class="bar"><span class="muted" style="text-align:center">🔒 Your picks are private</span></div>
</div></figure>

<!-- 4 PLANS -->
<figure><figcaption>4 · Plans (Safe selected)</figcaption>
<div class="phone">
  <div class="demo">⚑ Demo mode: cached data</div>
  <div class="body">
    <h1 class="t">Three good options</h1>
    <div class="map">
      <svg viewBox="0 0 358 220" width="100%" height="220" aria-label="Map with route">
        <rect width="358" height="220" fill="#EFE9E1"/>
        <g stroke="#fff" stroke-width="10"><path d="M0 60H358M0 150H358M90 0V220M230 0V220"/></g>
        <g stroke="#fff" stroke-width="5"><path d="M0 105H358M160 0V220M300 0V220"/></g>
        <rect x="236" y="160" width="60" height="50" rx="6" fill="#D8E8D2"/>
        <path d="M90 60 H160 V150 H230 V105 H300" fill="none" stroke="#0F766E" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
        <g font-family="Inter" font-weight="600" font-size="13" fill="#fff" text-anchor="middle">
          <circle cx="90" cy="60" r="14" fill="#0F766E"/><text x="90" y="65">1</text>
          <circle cx="230" cy="150" r="14" fill="#0F766E"/><text x="230" y="155">2</text>
          <circle cx="300" cy="105" r="14" fill="#0F766E"/><text x="300" y="110">3</text>
        </g>
      </svg>
    </div>
    <div class="card" style="display:flex;flex-direction:column;gap:12px;border:2px solid var(--safe)">
      <div class="row between"><div class="row"><span class="kind k-safe">Safe</span><span class="pill">★ Council pick</span></div><span class="small num"><strong>$34</strong> / person</span></div>
      <div><span class="big num" style="color:var(--safe)">93%</span> <span class="small">sure nobody's unhappy</span><br><button class="btn-text" style="min-height:32px;padding:0">What does this mean?</button></div>
      <ol class="tl num">
        <li><span>18:00</span><span><span class="dot"></span></span><span><strong>Lotus Garden</strong> · dinner<br><span class="chip ok" style="margin-top:4px">✓ Open now · vegetarian options · checked 2 min ago</span></span></li>
        <li><span></span><span class="line"></span><span class="walk">🚶 7 min walk</span></li>
        <li><span>19:30</span><span><span class="dot"></span></span><span><strong>Northside Pottery</strong> · activity</span></li>
        <li><span></span><span class="line"></span><span class="walk">🚶 4 min walk</span></li>
        <li><span>20:50</span><span><span class="dot"></span></span><span><strong>Moon Tea Bar</strong> · dessert</span></li>
      </ol>
      <details class="small"><summary style="cursor:pointer;color:var(--accent);font-weight:600">Why this plan?</summary><p class="muted" style="margin-top:4px">Someone gave up a little novelty; someone accepted a longer walk.</p></details>
    </div>
    <div class="mini"><div class="row"><span class="kind k-bold">Bold</span><span class="small">Night market + karaoke</span></div><span class="small num"><strong style="color:var(--bold)">81%</strong> · $41</span></div>
    <div class="mini"><div class="row"><span class="kind k-budget">Budget</span><span class="small">Tacos + park + gelato</span></div><span class="small num"><strong style="color:var(--budget)">86%</strong> · $19</span></div>
  </div>
  <div class="bar"><button class="btn btn-primary">Go to vote →</button></div>
</div></figure>

<!-- 5 COUNCIL -->
<figure><figcaption>5 · Council panel</figcaption>
<div class="phone">
  <div class="demo">⚑ Demo mode: cached data</div>
  <div class="body">
    <h1 class="t">The council</h1><span class="chip" style="align-self:flex-start;margin-top:-8px">AI-generated · numbers checked</span>
    <div class="card grid">
      <span></span><span class="h">Safe</span><span class="h">Bold</span><span class="h">Budget</span>
      <span class="h" style="text-align:left;color:var(--adv-a)">Advocate A</span><span class="st for" style="color:var(--adv-a)"></span><span class="st" style="color:var(--adv-a)"></span><span class="st ok" style="color:var(--adv-a)"></span>
      <span class="h" style="text-align:left;color:var(--adv-b)">Advocate B</span><span class="st ok" style="color:var(--adv-b)"></span><span class="st for" style="color:var(--adv-b)"></span><span class="st" style="color:var(--adv-b)"></span>
      <span class="h" style="text-align:left;color:var(--adv-c)">Advocate C</span><span class="st ok" style="color:var(--adv-c)"></span><span class="st" style="color:var(--adv-c)"></span><span class="st for" style="color:var(--adv-c)"></span>
      <span class="h" style="text-align:left;color:var(--adv-d)">Advocate D</span><span class="st for" style="color:var(--adv-d)"></span><span class="st ok" style="color:var(--adv-d)"></span><span class="st ok" style="color:var(--adv-d)"></span>
    </div>
    <div class="div">Round 1 · Openings</div>
    <div class="msg"><div class="adv" style="background:var(--adv-a)">A</div><div><div class="who">Advocate A</div><div class="bub" style="border-left-color:var(--adv-a)">Safe keeps my person at <b>ratioMean 0.88</b>. Bold drops to <b>0.61</b>.</div></div></div>
    <div class="msg"><div class="adv" style="background:var(--adv-b)">B</div><div><div class="who">Advocate B</div><div class="bub" style="border-left-color:var(--adv-b)">Bold is the most novel option; my person scores <b>0.93</b> there.</div></div></div>
    <div class="div">Round 2 · Responses</div>
    <div class="msg"><div class="adv" style="background:var(--adv-c)">C</div><div><div class="who">Advocate C</div><div class="bub" style="border-left-color:var(--adv-c)">Safe is acceptable at <b>0.79</b>. Bold would cost my person too much.</div></div></div>
    <p class="typing">Advocate D is thinking…</p>
    <div class="div">Chair</div>
    <div class="chair">⚖️ <strong>Chair:</strong> Safe has the highest floor, <b class="num">93%</b> robust, and no advocate is below <b class="num">0.79</b>.<div style="margin-top:8px"><span class="kind k-safe">Recommended: Safe</span></div></div>
  </div>
</div></figure>

<!-- 6 VOTE -->
<figure><figcaption>6 · Vote + roulette</figcaption>
<div class="phone">
  <div class="demo">⚑ Demo mode: cached data</div>
  <div class="body">
    <h1 class="t">Pick one</h1>
    <p class="muted">The council recommends. You decide.</p>
    <div class="vote on"><span class="kind k-safe">Safe</span><div style="flex:1"><div class="small"><strong>Quiet night</strong> · ★ Council pick</div><div class="muted num">93% · $34</div></div><div class="row"><span class="av sm t1">A</span><span class="av sm t3">J</span></div></div>
    <div class="vote"><span class="kind k-bold">Bold</span><div style="flex:1"><div class="small"><strong>Night market</strong></div><div class="muted num">81% · $41</div></div><div class="row"><span class="av sm t2">S</span></div></div>
    <div class="vote"><span class="kind k-budget">Budget</span><div style="flex:1"><div class="small"><strong>Tacos + park</strong></div><div class="muted num">86% · $19</div></div><div class="row"><span class="av sm t4">R</span></div></div>
    <div class="div">Tie? Spin</div>
    <div class="pointer"></div>
    <div class="wheel">
      <span style="top:58px;left:150px">Safe<br>42%</span>
